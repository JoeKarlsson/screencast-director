# Personal Vale config: the global styles from the Vale folder (dotfiles), plus the
# video layer for any file with "video" in its name.
StylesPath = /Users/joekarlsson/Library/Application Support/vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = JoeKarlsson, ai-tells, Slop, write-good
write-good.EPrime = NO
write-good.So = NO
ai-tells.ColonUsage = warning
ai-tells.VerbTricolon = NO

[**/*video*.md]
BasedOnStyles = JoeKarlsson, JoeVideo, ai-tells, Slop, write-good
write-good.EPrime = NO
write-good.So = NO
ai-tells.ColonUsage = warning
ai-tells.VerbTricolon = NO
