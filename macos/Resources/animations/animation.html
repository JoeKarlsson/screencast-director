<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The page `director animate` renders frame by frame: engine.js draws the shared look (paper,
     grain, camera); the renderer injects the template's script (from the video, the personal library or the app), which builds one kind of explainer from the plan's data.
     The renderer calls init(config) once, then seek(t) for every frame. -->
<style>
:root { --ink: #15151C; --paper: #FBFBF9; --accent: #FFE500; --title: Georgia, serif; --body: "Helvetica Neue", sans-serif; }
html, body { margin: 0; background: var(--paper); overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); transform-origin: 0 0; }
#cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
svg#lines { position: absolute; inset: 0; overflow: visible; }
.abs { position: absolute; left: 0; top: 0; will-change: transform; }
.sticker { width: 120px; height: 120px; margin: -60px 0 0 -60px; background: #fff; border-radius: 28px;
  box-shadow: 0 2px 0 rgba(21,21,28,.06), 0 calc(10px + 16px * var(--lift, 0)) calc(22px + 26px * var(--lift, 0)) rgba(21,21,28, calc(.20 - .07 * var(--lift, 0))); display: flex; align-items: center; justify-content: center; }
.sticker img { width: 72px; height: 72px; object-fit: contain; }
.sticker .word { font: 700 22px var(--body); color: var(--ink); text-align: center; padding: 0 8px; }
.dot { width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%; background: var(--ink);
  box-shadow: 0 0 0 9px #fff, 0 calc(16px + 22px * var(--lift, 0)) calc(34px + 36px * var(--lift, 0)) rgba(21,21,28, calc(.28 - .1 * var(--lift, 0))); display: flex; align-items: center; justify-content: center; }
.dot img { width: 92px; height: 92px; filter: invert(1); }
.dot .word { font: 400 36px var(--title); color: #fff; }
.label { font: 700 34px var(--body); color: var(--ink); white-space: nowrap; }
.hand { font: 400 46px var(--title); color: var(--ink); white-space: nowrap; }
.chip { background: #fff; padding: 2px 18px 8px; border-radius: 14px; box-shadow: 0 calc(8px + 12px * var(--lift, 0)) calc(18px + 20px * var(--lift, 0)) rgba(21,21,28, calc(.16 - .05 * var(--lift, 0))); }
.head { font: 400 62px var(--title); color: var(--ink); white-space: nowrap; }
.hl { position: absolute; left: -10px; right: -14px; top: 52%; height: 44%; background: var(--accent); z-index: -1;
  transform-origin: 0 50%; border-radius: 3px; transform: skewX(-8deg) scaleX(0); mix-blend-mode: multiply; }
.wrapt { position: relative; display: inline-block; isolation: isolate; }
.tag { font: 700 26px var(--body); color: var(--ink); background: #fff; padding: 12px 20px; border-radius: 10px; white-space: nowrap;
  box-shadow: 0 8px 18px rgba(21,21,28,.18); margin: -26px 0 0 0; }
.tag::before { content: ""; position: absolute; left: 50%; top: -12px; width: 70px; height: 24px; margin-left: -35px;
  background: var(--accent); opacity: .85; transform: rotate(-4deg); }
.icon { width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 5px #fff, 0 8px 16px rgba(21,21,28,.22); display: flex; align-items: center; justify-content: center; }
.icon svg { width: 34px; height: 34px; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.num { font: 400 104px var(--title); color: var(--ink); line-height: 1; }
.row { display: flex; align-items: baseline; gap: 18px; white-space: nowrap; }
.hub { width: 330px; height: 150px; margin: -75px 0 0 -165px; background: #fff; border-radius: 26px;
  box-shadow: 0 0 0 6px var(--accent), 0 calc(18px + 24px * var(--lift, 0)) calc(40px + 40px * var(--lift, 0)) rgba(21,21,28, calc(.25 - .09 * var(--lift, 0))); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.hub img { height: 34px; }
.hub div { font: 400 50px var(--title); color: var(--ink); }
.ghost { width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 14px; background: #fff; opacity: .9;
  box-shadow: 0 4px 10px rgba(21,21,28,.14); display: flex; align-items: center; justify-content: center; }
.ghost img { width: 30px; height: 30px; }
.ghost .word { font: 700 9px var(--body); color: var(--ink); }
.ringmark { border-radius: 50%; border: 7px solid var(--accent); box-sizing: border-box; mix-blend-mode: multiply; }
#grain { position: absolute; inset: -50px; pointer-events: none; mix-blend-mode: multiply; opacity: .32; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(60,50,30,.16) 100%); }
/* Flourishes (engine.js): heading words in masks, self-drawing icons, the landing burst, packets. */
.rw { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .08em; margin-bottom: -.08em; }
.rw > span { display: inline-block; }
svg.drawn { width: 96px; height: 96px; overflow: visible; }
.hub svg.drawn { width: 64px; height: 64px; }
.sticker svg.drawn { width: 78px; height: 78px; }
.dot svg.drawn path { stroke: #fff; }
svg.drawn path { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.burstmark { width: 330px; height: 330px; margin: -165px 0 0 -165px; overflow: visible; pointer-events: none; }
.burstmark g { fill: none; stroke: var(--accent); stroke-linecap: round; }
svg.packets { overflow: visible; pointer-events: none; }
html.theme-terminal svg.drawn path { stroke: var(--accent); stroke-width: 4; stroke-linecap: square; stroke-linejoin: miter; }
/* Terminal theme (look.animationTheme "terminal"): a 90s screen. DOS-style boxes with square corners
   and hard offset shadows, mono type with a faint phosphor glow, [ bracketed ] labels, inverse-video
   highlights, two-tone green logos, a faint grid and scanlines. engine.js swaps the motion too:
   right-angle lines, flicker-on entrances, a slow drift, a shimmering phosphor, rolling scanlines,
   packets running along the lines and a blinking cursor. */
html.theme-terminal { --paper: #070A08; --ink: #DDEBE1; --title: "JetBrains Mono", Menlo, monospace; --body: "JetBrains Mono", Menlo, monospace; }
html.theme-terminal #stage { background:
  linear-gradient(rgba(158,240,184,.045) 1px, transparent 1px) 0 0 / 60px 60px,
  linear-gradient(90deg, rgba(158,240,184,.045) 1px, transparent 1px) 0 0 / 60px 60px, var(--paper);
  text-shadow: 0 0 8px rgba(158,240,184,.35); }
html.theme-terminal .sticker, html.theme-terminal .chip, html.theme-terminal .tag, html.theme-terminal .hub, html.theme-terminal .ghost {
  background: #0B100D; border: 2px solid var(--accent); border-radius: 0; box-shadow: 10px 10px 0 rgba(158,240,184,.16); }
html.theme-terminal .sticker .word, html.theme-terminal .ghost .word, html.theme-terminal .hub div, html.theme-terminal .tag { color: var(--ink); }
html.theme-terminal .dot { background: #0B100D; border-radius: 0; box-shadow: 0 0 0 2px var(--accent), 10px 10px 0 2px rgba(158,240,184,.16); }
html.theme-terminal .dot .word { color: var(--ink); }
html.theme-terminal .sticker img, html.theme-terminal .hub img, html.theme-terminal .ghost img, html.theme-terminal .dot img {
  filter: grayscale(1) contrast(1.6) brightness(1.15) sepia(1) hue-rotate(78deg) saturate(2.4); }
html.theme-terminal .icon { border-radius: 0; box-shadow: none; }
html.theme-terminal .icon svg { stroke: var(--paper); }
html.theme-terminal .tag::before { content: "[ "; position: static; width: auto; height: auto; margin: 0; background: none; opacity: 1; transform: none; }
html.theme-terminal .tag::after { content: " ]"; }
html.theme-terminal .hl { mix-blend-mode: normal; background: var(--accent); left: -8px; right: -8px; top: 2%; height: 96%; border-radius: 0;
  transform: none !important; opacity: 0; }
html.theme-terminal .wrapt.on .hl { opacity: 1; }
html.theme-terminal .wrapt.on { color: var(--paper); text-shadow: none; }
html.theme-terminal .cursor { color: var(--accent); margin-left: 6px; }
html.theme-terminal .ringmark { mix-blend-mode: normal; border-radius: 0; border-width: 4px; }
html.theme-terminal #grain { display: none; }
html.theme-terminal #vignette { background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, rgba(0,0,0,0) 2px 4px),
  radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
/* Chart (templates/chart.js): bars, a line's dots, value labels, category labels under the baseline. */
.bar { border-radius: 12px 12px 3px 3px; background: var(--ink); opacity: .88; }
.bar.lit { background: var(--accent); box-shadow: inset 0 0 0 5px var(--ink); opacity: 1; }
.pip { width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 7px var(--paper); }
.pip.hot { background: var(--accent); box-shadow: 0 0 0 7px var(--paper), 0 0 0 11px var(--ink); }
.label.cat { font-weight: 400; font-size: 30px; }
html.theme-terminal .bar { border-radius: 0; }
html.theme-terminal .bar.lit { box-shadow: none; }
html.theme-terminal .pip { border-radius: 0; }
.lottiebox svg { display: block; }
/* Note (templates/note.js) and any sticker (config.sticker): a card the page's width, which the video
   shows in a sticker border. Type is sized to the card (vw) and shrinks by --k to fit one row. */
html.sticker-page, html.sticker-page body { background: #fff; }
html.sticker-page #stage { display: none; }
.note { position: relative; box-sizing: border-box; width: 100vw; padding: 5vw 6vw 6vw; background: #fff; color: #0A0A0A; text-align: center; }
html:not(.sticker-page) .note { position: absolute; left: 50%; top: 50%; width: 40vw; transform: translate(-50%, -50%); }
.note .line { display: flex; justify-content: center; align-items: baseline; gap: 3.5vw; white-space: nowrap; }
.note .big { font: 400 calc(30vw * var(--k, 1)) / 1 var(--title); }
.note .txt { font: 400 calc(14vw * var(--k, 1)) / 1 var(--title); }
.note .small { font: 800 calc(6.4vw * var(--k, 1)) / 1.15 var(--body); margin-top: 3vw; }
.note .logo { margin-bottom: 3vw; }
.note .logo img { width: 62%; height: auto; max-height: 24vw; object-fit: contain; }
.note .logo .word { font: 700 9vw var(--body); }
.note.dark { background: #000; color: var(--accent); }
.note.dark .small { color: #EDEDED; }
.note svg.mark { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.note svg.mark path { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; }
.note.dark svg.mark path { stroke: #EDEDED; }
html:not(.sticker-page) .note .line { overflow: hidden; }
/* Overlay (config.overlay): the graphics float over the video, so nothing is painted behind them,
   whatever the theme. Highlighters multiply onto the video instead of the paper. */
html.overlay, html.overlay body, html.overlay #stage { background: transparent !important; }
html.overlay #grain, html.overlay #vignette { display: none !important; }
/* Text that sits on the paper gets the paper behind it instead, so it reads over the video. */
html.overlay .head, html.overlay .hand:not(.chip), html.overlay .row {
  background: var(--paper); padding: 4px 22px 10px; border-radius: 14px; }
html.overlay.theme-terminal .head, html.overlay.theme-terminal .hand:not(.chip), html.overlay.theme-terminal .row { border-radius: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam"><svg id="lines" width="1920" height="1080"></svg></div>
  <svg id="grain" width="2020" height="1180"><filter id="n"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="1"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 -1.6 1.25"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div id="vignette"></div>
  <svg width="0" height="0" style="position: absolute">
    <!-- Three wobble frames a hand-drawn piece boils through (lottie.js; themes may use them too). -->
    <filter id="boil-1" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="turbulence" baseFrequency="0.02" seed="11" result="w"/><feDisplacementMap in="SourceGraphic" in2="w" scale="5"/></filter>
    <filter id="boil-2" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="turbulence" baseFrequency="0.02" seed="22" result="w"/><feDisplacementMap in="SourceGraphic" in2="w" scale="5"/></filter>
    <filter id="boil-3" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="turbulence" baseFrequency="0.02" seed="33" result="w"/><feDisplacementMap in="SourceGraphic" in2="w" scale="5"/></filter></svg>
</div>
<!-- lottie-web 5.12.2 (SVG build, MIT, vendor/lottie-LICENSE.md): the lottie template seeks it frame by frame. -->
<script src="vendor/lottie_svg.min.js"></script>
<script src="engine.js"></script>
</body>
</html>
