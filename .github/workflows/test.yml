name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: macos/test.sh
      - run: swift build --package-path macos
