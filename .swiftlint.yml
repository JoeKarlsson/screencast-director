# SwiftLint for macos/. Run with macos/lint.sh (it points SwiftLint at the Command Line Tools,
# since this project builds without Xcode).
included:
  - macos/Sources
  - macos/Tests

disabled_rules:
  - identifier_name        # short names (x, a, b, dt) are the norm in the timeline and render math
  - trailing_comma         # multi-line literals end with a comma on purpose
  - large_tuple            # (start, end, speed)-style tuples are clearer than one-off structs
  - function_parameter_count
  - todo
  - optional_data_string_conversion  # process output and file text decode lossily on purpose: a bad byte shouldn't drop the whole text

type_name:
  excluded: [S3]  # the service's name

line_length:
  warning: 180
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

# Size limits are warnings only: a long SwiftUI view or renderer is normal here.
function_body_length:
  warning: 120
  error: 400
type_body_length:
  warning: 500
  error: 1500
file_length:
  warning: 1000
  error: 2500
cyclomatic_complexity:
  warning: 25
  error: 60

custom_rules:
  # The app's type sizes come from Theme (Theme.font for text, Theme.glyph for symbols and display
  # numerals), so the scale doesn't drift one hard-coded size at a time.
  font_tokens:
    name: "Font tokens"
    included: "macos/Sources/ScreencastDirector/.*\\.swift"
    excluded: "macos/Sources/ScreencastDirector/Theme\\.swift"
    regex: '\.system\(size:'
    message: "Use Theme.font(...) or Theme.glyph(...) instead of a hard-coded font size"
    severity: error
  # UI motion comes from Theme.Motion (enter, exit, move, allowed), which drops springs and turns
  # every animation off under Reduce Motion.
  motion_tokens:
    name: "Motion tokens"
    included: "macos/Sources/ScreencastDirector/.*\\.swift"
    excluded: "macos/Sources/ScreencastDirector/Theme\\.swift"
    regex: 'withAnimation\s*(\{|\(\.)|\.animation\(\.|\.(snappy|bouncy|spring)\b'
    message: "Use Theme.Motion.enter/exit/move or Theme.Motion.allowed(...) so Reduce Motion is respected"
    severity: error
